<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña | Campus Connect</title>
  <link rel="stylesheet" href="../../assets/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="logo" href="../../index.html">Campus Connect</a>
      <a class="button outline-button" href="login.html">Iniciar sesión</a>
    </div>
  </header>

  <main class="container">
    <section class="form-card">
      <h1>Recuperar contraseña</h1>
      <p>Envía un enlace de recuperación a tu correo.</p>
      <form id="resetForm" class="form-grid">
        <label>
          Correo electrónico
          <input id="resetEmail" name="email" type="email" autocomplete="email" required placeholder="ejemplo@dominio.com" />
        </label>
        <button type="submit" class="solid-button">Enviar enlace</button>
      </form>
      <div class="form-actions">
        <a class="text-button" href="login.html">Volver al inicio</a>
      </div>
      <div id="authMessage" class="status-message hidden" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="../../assets/js/auth.js"></script>
</body>
</html>
