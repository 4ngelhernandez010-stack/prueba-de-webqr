<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página del profesor</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Página del profesor</h1>
      <p id="welcome"></p>
      <div class="qr-box">
        <div id="qrContainer"></div>
      </div>
      <p class="help-text">Escanea este QR desde la página del alumno para registrar su asistencia.</p>
      <div class="session-info">
        <strong>Sesión:</strong> <span id="sessionId"></span>
      </div>
      <h2>Alumnos conectados</h2>
      <ul id="studentList" class="list"></ul>
      <div id="noStudents" class="empty">Aún no se han registrado alumnos.</div>
      <a class="secondary-link" href="index.html">Volver al inicio</a>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
