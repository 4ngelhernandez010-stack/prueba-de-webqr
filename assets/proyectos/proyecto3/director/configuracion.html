<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGA IPDDVM - Configuración</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-qF/myoCcB6FQVoO4f2ZHnIiG6vM4ayL9QYJjglcYyjkTprISGCT6Lyo5E7xB1N6a" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="dashboard-page">
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon"><img src="../assets/img/logo.png" alt="Logo del colegio" class="brand-logo"></div>
        <div>
          <h5 class="mb-0">SIGA IPDDVM</h5>
          <small class="text-muted">Director</small>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="usuarios.html" class="sidebar-link"><i class="bi bi-person-badge"></i> Usuarios</a>
        <a href="docentes.html" class="sidebar-link"><i class="bi bi-person-lines-fill"></i> Docentes</a>
        <a href="estudiantes.html" class="sidebar-link"><i class="bi bi-people"></i> Estudiantes</a>
        <a href="reportes.html" class="sidebar-link"><i class="bi bi-graph-up"></i> Reportes</a>
        <a href="configuracion.html" class="sidebar-link"><i class="bi bi-gear"></i> Configuración</a>
        <a href="../index.html" class="sidebar-link"><i class="bi bi-box-arrow-in-left"></i> Cerrar sesión</a>
      </nav>
    </aside>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h2>Configuración</h2>
          <p>Opciones institucionales y ajustes visuales.</p>
        </div>
      <button id="theme-toggle" class="btn btn-outline-secondary theme-toggle" type="button" aria-label="Cambiar tema"><i class="bi bi-moon-stars-fill"></i></button>
      </div>
      <div class="card-custom">
        <h4>Datos institucionales</h4>
        <form class="row g-3 mt-3">
          <div class="col-md-6">
            <label class="form-label">Nombre del Instituto</label>
            <input type="text" class="form-control" value="Instituto Polivalente Dr. Doroteo Varela Mejía" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label">Dirección</label>
            <input type="text" class="form-control" value="Av. Independencia, Santo Domingo" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label">Teléfono</label>
            <input type="text" class="form-control" value="+1 809 555 0000" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label">Correo institucional</label>
            <input type="text" class="form-control" value="contacto@ipddvm.edu.do" readonly>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script src="../assets/js/app.js"></script>
