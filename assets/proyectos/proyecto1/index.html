<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>control de finanzas</title>

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BASE */
body {
  font-family: Inter, sans-serif;
  background: #0b0b0c;
  color: #e4e4e7;
}

/* LAYOUT */
.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

/* CARDS */
.card {
  background: #151517;
  border: 1px solid #2a2a2d;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}

/* INPUTS */
input, select {
  width: 100%;
  padding: 10px;
  background: #111;
  border: 1px solid #2a2a2d;
  color: #e4e4e7;
  border-radius: 8px;
  margin-top: 10px;
}

/* BUTTON */
button {
  margin-top: 10px;
  padding: 10px;
  background: #27272a;
  border: none;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #3f3f46;
}

/* PROGRESS */
.progress {
  height: 12px;
  background: #1f1f23;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 10px;
}

.bar {
  height: 100%;
  background: #71717a;
  width: 0%;
}

/* TABLE */
.table {
  margin-top: 10px;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  border-bottom: 1px solid #2a2a2d;
}

.row:hover {
  background: #1a1a1d;
}

/* TAG */
.tag {
  font-size: 12px;
  color: #9ca3af;
}

/* DELETE */
.delete {
  color: #ef4444;
  cursor: pointer;
}

</style>
</head>

<body>

<div class="container">

<h1>Control Financiero</h1>

<div class="card">
  <h2>Dashboard</h2>
  <p>Total: L <span id="total">0</span></p>
  <p>Meta: L <span id="goal">1000</span></p>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>
</div>

<div class="card">
  <h2>Agregar movimiento</h2>

  <input id="amount" type="number" placeholder="Monto">
  <input id="desc" type="text" placeholder="Descripción">

  <select id="type">
    <option value="income">Ingreso</option>
    <option value="expense">Gasto</option>
  </select>

  <select id="category">
    <option>General</option>
    <option>Comida</option>
    <option>Entretenimiento</option>
    <option>Tecnología</option>
  </select>

  <button onclick="add()">Guardar</button>
</div>

<div class="card">
  <h2>Filtros</h2>

  <select id="filterType" onchange="render()">
    <option value="all">Todos</option>
    <option value="income">Ingresos</option>
    <option value="expense">Gastos</option>
  </select>

  <input id="search" placeholder="Buscar..." oninput="render()">
</div>

<div class="card">
  <h2>Historial</h2>
  <div id="list" class="table"></div>
</div>

</div>

<script>

class App {
  constructor() {
    this.state = JSON.parse(localStorage.getItem("app")) || {
      total: 0,
      goal: 1000,
      data: []
    };
    this.render();
  }

  save() {
    localStorage.setItem("app", JSON.stringify(this.state));
  }

  addTransaction(amount, type, desc, category) {
    if (!amount || amount <= 0) return;

    const t = {
      id: Date.now(),
      amount,
      type,
      desc,
      category,
      date: new Date().toLocaleString()
    };

    if (type === "income") this.state.total += amount;
    else this.state.total -= amount;

    this.state.data.push(t);
    this.save();
    this.render();
  }

  delete(id) {
    const t = this.state.data.find(x => x.id === id);

    if (t.type === "income") this.state.total -= t.amount;
    else this.state.total += t.amount;

    this.state.data = this.state.data.filter(x => x.id !== id);
    this.save();
    this.render();
  }

  render() {
    document.getElementById("total").innerText = this.state.total;
    document.getElementById("goal").innerText = this.state.goal;

    const percent = (this.state.total / this.state.goal) * 100;
    document.getElementById("bar").style.width = percent + "%";

    const list = document.getElementById("list");
    list.innerHTML = "";

    const filter = document.getElementById("filterType").value;
    const search = document.getElementById("search").value.toLowerCase();

    this.state.data
      .filter(t => filter === "all" || t.type === filter)
      .filter(t => t.desc.toLowerCase().includes(search))
      .slice()
      .reverse()
      .forEach(t => {
        const row = document.createElement("div");
        row.className = "row";

        row.innerHTML = `
          <div>
            <b>${t.type === "income" ? "+" : "-"}${t.amount}</b>
            <div class="tag">${t.category} | ${t.date}</div>
            <div>${t.desc}</div>
          </div>
          <div class="delete" onclick="app.delete(${t.id})">X</div>
        `;

        list.appendChild(row);
      });
  }
}

const app = new App();

function add() {
  const amount = parseInt(document.getElementById("amount").value);
  const type = document.getElementById("type").value;
  const desc = document.getElementById("desc").value;
  const category = document.getElementById("category").value;

  app.addTransaction(amount, type, desc, category);
}

</script>

</body>
</html>
